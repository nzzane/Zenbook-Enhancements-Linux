PACKAGE_NAME="asus-wmi-kbd-levels"
PACKAGE_VERSION="7.2.9.2"
BUILT_MODULE_NAME[0]="asus-wmi"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86/"
# The source is upstream 7.2.9 asus-wmi.c; only build it for the 7.2 series.
# Other kernels keep their in-tree asus-wmi (4 levels).
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
AUTOINSTALL="yes"
