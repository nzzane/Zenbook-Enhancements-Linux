# Number of keyboard backlight levels above off. Must be at most the number of
# duty= values given to asus_kbd_pwkb minus one.
# kbd_hotkey_levels: the levels the backlight key steps through. The LED class
# device, UPower and desktop sliders still get every level.
# Install as /etc/modprobe.d/asus-wmi-kbd-levels.conf.
options asus_wmi kbd_max_brightness=10 kbd_hotkey_levels=0,1,3,5,10
